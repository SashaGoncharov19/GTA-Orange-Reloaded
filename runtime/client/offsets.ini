; GTA:Orange game offsets (orange-core.dll reads this file from its own folder)
;
; orange-core hooks GTA5.exe at ~90 addresses. The built-in reference values
; belong to the game build of January 2017; on any other build the entries
; are found by byte patterns (verified on 1.0.3889.0) and orange-core writes
;
;     offsets-<game version>.generated.ini
;
; next to itself listing what resolved and what did not. Only the nine script
; engine entries are required; when one of them is unresolved orange-core
; stays inactive until it is filled in below (in a section named after your
; game version, e.g. [1.0.3411.0]). Any entry can also be overridden or
; disabled here. docs/UPDATING_OFFSETS.md explains how to find the values.
;
; Value syntax:
;   Name = 0x1F26D4              RVA, i.e. address minus the GTA5.exe base
;   Name = disabled              skip this hook / patch (optional entries only
;                                make sense here; required ones stay missing)
;   Name = scan                  use the byte pattern built into orange-core
;   Name = 48 8B ? ? E8 @ -7     scan for this pattern and add -7 to the match
;
; Sections:
;   [<version>]   applies to that exact GTA5.exe version (client.log prints it)
;   [default]     applies to every version, lower priority than [<version>]
;
; Example (values are placeholders, not real offsets):
;
; [1.0.3411.0]
; ScrThreadCollection = scan
; ActiveThreadTlsOffset = scan
; CodeCave = 0x123450
; EscFreeze = disabled
;
; [default]
; SnowPatch = disabled
